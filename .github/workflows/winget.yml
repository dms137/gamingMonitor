name: Winget

# Opens a winget-pkgs manifest PR on every GitHub release.
# Requires a WINGET_PAT secret (classic token, public_repo scope).
# Kicks in after the first manual submission is merged.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to publish to winget'
        required: true

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - name: Strip v prefix
        id: version
        shell: pwsh
        run: |
          $ref = "${{ github.event.release.tag_name || inputs.tag }}"
          echo "number=$($ref.TrimStart('v'))" >> $env:GITHUB_OUTPUT

      - name: Update winget manifest
        uses: vedantmgoyal2009/winget-releaser@v2
        with:
          identifier: dms137.GamingMonitor
          version: ${{ steps.version.outputs.number }}
          installers-regex: 'GamingMonitor-.*-win-x64\.zip$'
          token: ${{ secrets.WINGET_PAT }}
