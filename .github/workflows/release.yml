name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Set version from tag
        shell: pwsh
        run: echo "APP_VERSION=$($env:GITHUB_REF_NAME.TrimStart('v'))" >> $env:GITHUB_ENV

      - name: Publish self-contained single-file build
        run: >
          dotnet publish GamingMonitor.csproj -c Release -r win-x64
          --self-contained true
          -p:Version=${{ env.APP_VERSION }}
          -p:PublishSingleFile=true
          -p:PublishReadyToRun=true
          -p:PublishTrimmed=false
          -o publish

      - name: Pack release archive
        shell: pwsh
        run: Compress-Archive -Path publish/GamingMonitor.exe,publish/assets -DestinationPath GamingMonitor-${{ github.ref_name }}-win-x64.zip

      - name: Build release notes
        id: notes
        shell: pwsh
        run: |
          $prev = ""
          try { $prev = git describe --tags --abbrev=0 HEAD^ 2>$null } catch { }
          if ([string]::IsNullOrWhiteSpace($prev)) {
            $range = $env:GITHUB_REF_NAME
            $compare = ""
          } else {
            $range = "$prev..$env:GITHUB_REF_NAME"
            $compare = "**Full Changelog**: https://github.com/dms137/gamingMonitor/compare/$prev...$env:GITHUB_REF_NAME`n`n"
          }
          $log = git log $range --pretty=format:'- %s (%h)'
          $body = "$compare$log"
          Add-Content -Path $env:GITHUB_OUTPUT -Value "body<<EOF" -Encoding utf8
          Add-Content -Path $env:GITHUB_OUTPUT -Value $body -Encoding utf8
          Add-Content -Path $env:GITHUB_OUTPUT -Value "EOF" -Encoding utf8

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: GamingMonitor-*.zip
          body: ${{ steps.notes.outputs.body }}
