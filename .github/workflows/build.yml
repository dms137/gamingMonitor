name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build
        run: dotnet build GamingMonitor.sln --nologo -v q

      - name: Audit packages
        run: dotnet list GamingMonitor.sln package --vulnerable --include-transitive
